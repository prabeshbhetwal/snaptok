name: Android validation

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Owner requested local-only CI. A skipped job is not executed validation.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint and Preview assembly
        run: |
          sh scripts/build-local.sh :app:testDebugUnitTest :app:lintPreview :app:assemblePreview :app:assembleDebugAndroidTest \
            --no-daemon --no-parallel --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx1g -XX:+UseSerialGC' \
            -Pkotlin.compiler.execution.strategy=in-process
      - name: Enable emulator acceleration
        run: |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules <<'EOF'
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          EOF
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline native integration
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: ANDROID_SERIAL=emulator-5554 sh scripts/test-android-offline.sh
      - name: Locate build reports
        if: always()
        id: reports
        run: |
          if [ -f work/build-directory.txt ]; then
            echo "path=$(cat work/build-directory.txt)" >> "$GITHUB_OUTPUT"
          fi
      - name: Save reports
        if: always() && steps.reports.outputs.path != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ steps.reports.outputs.path }}/reports/
            ${{ steps.reports.outputs.path }}/test-results/
            ${{ steps.reports.outputs.path }}/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn
